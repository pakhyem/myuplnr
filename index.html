<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>스케줄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --card:#FFFFFF;
    --ink:#2B2620;
    --ink-soft:#6E6659;
    --line:#E3DECD;
    --teal:#2F6F62;
    --teal-tint:#E4EFEA;
    --teal-tint-strong:#CFE3DA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    width:100%;
    max-width:460px;
    margin:0 auto;
    padding:28px 1px 48px;
  }
  .eyebrow{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
    margin:0 0 4px 2px;
  }
  .calendar-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:0;
    padding:22px 4px 18px;
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:0 0 2px 0;
  }
  .month-title{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:24px;
    line-height:1;
    color:var(--ink);
  }
  .month-title span{ color:var(--ink); }
  .nav-btn{
    border:none;
    background:none;
    color:var(--ink);
    font-size:20px;
    font-weight:700;
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:8px;
    flex-shrink:0;
  }
  .nav-btn:active{ opacity:0.5; }
  .month-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 18px 2px;
  }
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:6px;
  }
  .weekday-row div{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .weekday-row div:nth-child(6){ color:#4E7DB5; }
  .weekday-row div:nth-child(7){ color:#B5544E; }

  .grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
  }
  .cell{
    position:relative;
    min-height:64px;
    min-width:0;
    padding:6px 2px 6px;
    border-bottom:1px solid var(--line);
  }
  .cell.pad{ background:transparent; }
  .cell .num{
    font-size:13px;
    color:var(--ink);
    font-weight:500;
  }
  .cell.pad .num{ color:#CFC9B8; font-weight:400; }
  .cell.sat .num{ color:#4E7DB5; }
  .cell.sun .num{ color:#B5544E; }
  .cell.today .num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:20px;height:20px;
    background:var(--ink);
    color:var(--paper);
    border-radius:50%;
    font-size:12px;
  }
  .event-list{
    display:flex;
    flex-direction:column;
    gap:1px;
    margin-top:1px;
  }
  .event-btn{
    display:block;
    width:100%;
    background:var(--teal-tint);
    border:1px solid var(--teal-tint-strong);
    border-radius:4px;
    padding:4px 2px;
    font-family:'Inter',sans-serif;
    font-size:10px;
    line-height:1.3;
    color:var(--teal);
    text-align:left;
    cursor:pointer;
  }
  .event-btn:active{ opacity:0.7; }
  .cell.pad .event-btn{ opacity:0.4; }
  .event-btn .t{ display:block; font-weight:600; font-size:10.5px; }
  .event-btn .n{
    display:block;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .hint{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:16px;
  }

  /* overlay */
  .overlay{
    position:fixed; inset:0;
    background:rgba(30,26,20,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    padding :20px;
    z-index:50;
  }
  .overlay[hidden]{ display:none; }
  .sheet{
    width:100%;
    max-width:320px;
    background:var(--card);
    border-radius:0;
    padding:22px 20px 26px;
    position:relative;
    animation:popIn 0.15s ease-out;
    box-shadow:0 8px 28px rgba(0,0,0,0.16);
  }
  @keyframes popIn{
    from{ transform:scale(0.96); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  .sheet-info-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:4px 8px 10px 0;
  }
  #sheet-datetime{
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--ink);
    letter-spacing:0.01em;
  }
  .copy-btn{
    position:absolute;
    top:14px; right:16px;
    width:30px; height:30px;
    border:none;
    background:none;
    border-radius:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:var(--ink-soft);
    padding:0;
    flex-shrink:0;
  }
  .copy-btn:active{ background:var(--paper); }
  .copy-btn svg{ width:15px; height:15px; }
  .divider{
    height:1px;
    background:var(--line);
    margin-bottom:10px;
  }
  .sheet-names{
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:600;
    line-height:1.9;
    color:var(--ink);
  }
    .sheet-note{
    display:inline-block;
    margin-top:8px;
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    color:var(--ink-soft);
    text-decoration:none;    
  }
    .sheet-note[hidden]{ display:none; }
  .toast{
    position:absolute;
    left:50%; bottom:14px;
    transform:translateX(-50%) translateY(6px);
    background:var(--ink);
    color:var(--paper);
    font-size:12.5px;
    padding:8px 14px;
    border-radius:0;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.18s ease, transform 0.18s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="page">
  <p class="eyebrow">전하영 배우 스케줄</p>
  <div class="calendar-card">
    <div class="month-nav">
      <button class="nav-btn" id="prev-month" aria-label="이전 달">&lt;</button>
      <div class="month-title" id="month-title"></div>
      <button class="nav-btn" id="next-month" aria-label="다음 달">&gt;</button>
    </div>
    <div class="month-sub"></div>
    <div class="weekday-row">
      <div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div>
    </div>
    <div id="calendar-grid" class="grid"></div>
    <p class="hint" id="loading-msg">일정을 불러오는 중...</p>
  </div>
  <p class="hint">일정이 있는 날짜를 눌러 자세히 확인하세요.</p>
</div>

<div id="overlay" class="overlay" hidden>
  <div class="sheet">
      <button class="copy-btn" id="copy-btn" aria-label="복사">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="9" width="12" height="12" stroke="currentColor" stroke-width="1.8"/>
          <path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="1.8"/>
        </svg>
      </button>
    <div class="sheet-info-row">
      <span id="sheet-datetime"></span>
    </div>
    <div class="divider"></div>
    <div class="sheet-names">
      <div id="sheet-names-list"></div>
    </div>
    <div class="sheet-note" id="sheet-note" hidden></div>
    <div class="toast" id="toast">복사되었습니다</div>
  </div>
</div>

<script>
/* ========================================================
   여기만 수정하세요
   ======================================================== */
const YEAR = 2026;
const MONTH = 9; // 1~12

// 구글 시트를 "웹에 게시 > CSV" 한 링크를 여기에 붙여넣으면,
// 이후로는 이 파일을 다시 건드리거나 재업로드할 필요 없이
// 구글 시트만 수정하면 사이트에 자동으로 반영됩니다.
// 비워두면(따옴표만 남기면) 아래 EVENTS 예비 데이터로 표시됩니다.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRKse3sHKZwXeZKs4FUptsSgtYzdvAT5LioPIev7ZxTUMYYIYor5WnKLJh-SALIOS7NZdFPUUa6o3xD/pub?gid=0&single=true&output=csv";

// 예비 데이터 (SHEET_CSV_URL을 설정하지 않았을 때, 또는 시트 로딩 실패 시 표시)
const EVENTS = [];
/* ======================================================== */

const WEEKDAY_LABELS = ["월","화","수","목","금","토","일"];

function pad(n){ return String(n).padStart(2,"0"); }

function buildKey(y,m,d){
  return `${y}-${pad(m)}-${pad(d)}`;
}

// 날짜별 이벤트 그룹화 (배열 -> {date: [event, ...]} 형태로 변환)
function groupEventsByDate(list){
  const map = {};
  list.forEach(ev => {
    if(!map[ev.date]) map[ev.date] = [];
    map[ev.date].push(ev);
  });
  return map;
}

// 공연(title)마다 다른 색을 순서대로 배정
const TITLE_PALETTE = [
  { text:"#a61782", bg:"#fae1f4", border:"#b8b8b8" }, // teal
  { text:"#dbeaff", bg:"#61a3ff", border:"#E3e3e3" }, // amber
  { text:"#3D5A99", bg:"#E4EAF5", border:"#C9D5EC" }, // blue
  { text:"#8B3A62", bg:"#F3E1EA", border:"#E6C3D6" }, // plum
  { text:"#4B7F3D", bg:"#E7F0E1", border:"#CEE0C2" }, // green
  { text:"#A6432D", bg:"#F5E1DB", border:"#EAC3B7" }  // rust
];

function buildTitleColorMap(list){
  const map = {};
  list.forEach(ev => {
    if(!(ev.title in map)){
      map[ev.title] = TITLE_PALETTE[Object.keys(map).length % TITLE_PALETTE.length];
    }
  });
  return map;
}

// 아주 단순한 CSV 파서 (헤더: date,time,title,name / 캐스트 1명당 한 줄)
function parseCsvToEvents(csvText){
  const lines = csvText.split(/\r?\n/).filter(l => l.trim().length > 0);
  if(lines.length < 2) return [];
  const header = lines[0].split(",").map(h => h.trim().toLowerCase());
  const idx = {
    date: header.indexOf("date"),
    time: header.indexOf("time"),
    title: header.indexOf("title"),
    name: header.indexOf("name"),
    note: header.indexOf("note")
  };
  const byKey = {};
  const order = [];
  for(let i=1; i<lines.length; i++){
    const cols = lines[i].split(",").map(c => c.trim());
    const date = cols[idx.date];
    const time = cols[idx.time];
    const title = cols[idx.title];
    const name = cols[idx.name];
    const note = cols[idx.note];
    if(!date || !time || !title || !name) continue;
    const key = `${date}__${time}__${title}`;
    if(!byKey[key]){
      byKey[key] = { date, time, title, names: [], note: note || ""};
      order.push(key);
    }
    byKey[key].names.push(name);
  }
  return order.map(k => byKey[k]);
}

let eventsByDate = groupEventsByDate(EVENTS);
let titleColorMap = buildTitleColorMap(EVENTS);
let currentYear = YEAR;
let currentMonth = MONTH;

async function loadFromSheetIfConfigured(){
  const loadingMsg = document.getElementById("loading-msg");
  if(!SHEET_CSV_URL){
    if(loadingMsg) loadingMsg.hidden = true;
    return;
  }
  try{
    const res = await fetch(SHEET_CSV_URL);
    if(!res.ok) throw new Error("sheet fetch failed");
    const csvText = await res.text();
    const parsed = parseCsvToEvents(csvText);
    if(parsed.length > 0){
      eventsByDate = groupEventsByDate(parsed);
      titleColorMap = buildTitleColorMap(parsed);
      renderCalendar(currentYear, currentMonth);
    }
  }catch(err){
    console.warn("구글 시트 데이터를 불러오지 못해 예비 데이터를 표시합니다.", err);
  } finally {
    if(loadingMsg) loadingMsg.hidden = true;
  }   
}

function renderMonthTitle(year, month){
  document.getElementById("month-title").innerHTML = `${year}<span>.</span>${pad(month)}`;
}

function goToMonth(year, month){
  let y = year, m = month;
  if(m < 1){ m = 12; y -= 1; }
  else if(m > 12){ m = 1; y += 1; }
  currentYear = y;
  currentMonth = m;
  renderMonthTitle(currentYear, currentMonth);
  renderCalendar(currentYear, currentMonth);
}

document.getElementById("prev-month").addEventListener("click", () => goToMonth(currentYear, currentMonth - 1));
document.getElementById("next-month").addEventListener("click", () => goToMonth(currentYear, currentMonth + 1));


function renderCalendar(year, month){
  const grid = document.getElementById("calendar-grid");
  grid.innerHTML = "";

  const firstOfMonth = new Date(year, month-1, 1);
  // JS: 0=일,1=월... 월요일 시작 기준으로 변환 (0=월 ... 6=일)
  const jsDay = firstOfMonth.getDay();
  const leadingEmpty = (jsDay === 0) ? 6 : jsDay - 1;

  const daysInMonth = new Date(year, month, 0).getDate();
  const daysInPrevMonth = new Date(year, month-1, 0).getDate();

  const totalCells = Math.ceil((leadingEmpty + daysInMonth) / 7) * 7;

  const todayStr = (() => {
    const t = new Date();
    return buildKey(t.getFullYear(), t.getMonth()+1, t.getDate());
  })();

  for(let i=0; i<totalCells; i++){
    const cell = document.createElement("div");
    cell.className = "cell";

    let dayNum, cellYear, cellMonth, isPad = false;

    if(i < leadingEmpty){
      dayNum = daysInPrevMonth - leadingEmpty + 1 + i;
      cellMonth = month - 1 === 0 ? 12 : month - 1;
      cellYear = month - 1 === 0 ? year - 1 : year;
      isPad = true;
    } else if(i >= leadingEmpty + daysInMonth){
      dayNum = i - (leadingEmpty + daysInMonth) + 1;
      cellMonth = month + 1 === 13 ? 1 : month + 1;
      cellYear = month + 1 === 13 ? year + 1 : year;
      isPad = true;
    } else {
      dayNum = i - leadingEmpty + 1;
      cellMonth = month;
      cellYear = year;
    }

    const colIndex = i % 7; // 0=월 ... 5=토, 6=일
    if(colIndex === 5) cell.classList.add("sat");
    if(colIndex === 6) cell.classList.add("sun");
    if(isPad) cell.classList.add("pad");

    const dateKey = buildKey(cellYear, cellMonth, dayNum);
    if(!isPad && dateKey === todayStr) cell.classList.add("today");

    const num = document.createElement("span");
    num.className = "num";
    num.textContent = dayNum;
    cell.appendChild(num);

    if(eventsByDate[dateKey]){
      const list = document.createElement("div");
      list.className = "event-list";
      eventsByDate[dateKey].forEach(ev => {
        const btn = document.createElement("button");
        btn.className = "event-btn";
        const color = titleColorMap[ev.title] || TITLE_PALETTE[0];
        btn.style.background = color.bg;
        btn.style.borderColor = color.border;
        btn.style.color = color.text;
        btn.innerHTML = `<span class="t">${ev.time}</span><span class="n">${ev.title}</span>`;
        btn.addEventListener("click", () => openSheet(ev));
        list.appendChild(btn);
      });
      cell.appendChild(list);
    }

    grid.appendChild(cell);
  }
}

function formatDateKorean(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  const weekdays = ["일","월","화","수","목","금","토"];
  return `${y}.${pad(m)}.${pad(d)}(${weekdays[dt.getDay()]})`;
}

function formatTimePadded(timeStr){
  const [h,mi] = timeStr.split(":").map(Number);
  return `${pad(h)}:${pad(mi)}`;
}

const overlay = document.getElementById("overlay");
const sheetDatetime = document.getElementById("sheet-datetime");
const sheetNamesList = document.getElementById("sheet-names-list");
const sheetNote = document.getElementById("sheet-note");
const copyBtn = document.getElementById("copy-btn");
const toast = document.getElementById("toast");

let currentEvent = null;

function openSheet(ev){
  currentEvent = ev;
  sheetDatetime.textContent = `${ev.title} ${formatDateKorean(ev.date)} ${formatTimePadded(ev.time)}`;
  sheetNamesList.innerHTML = ev.names.join(", ");
  if(ev.note){
    sheetNote.textContent = ev.note;
    sheetNote.hidden = false;
  } else {
    sheetNote.hidden = true;
  }
  overlay.hidden = false;
}

function closeSheet(){
  overlay.hidden = true;
}

overlay.addEventListener("click", (e) => {
  if(e.target === overlay) closeSheet();
});

copyBtn.addEventListener("click", () => {
  if(!currentEvent) return;
  const text = `${currentEvent.title}\n${formatDateKorean(currentEvent.date)} ${formatTimePadded(currentEvent.time)}\n${currentEvent.names.join(", ")}`;
  copyToClipboard(text);
});

function copyToClipboard(text){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(showToast).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta);
  showToast();
}

function showToast(){
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1400);
}
renderMonthTitle(currentYear, currentMonth);
renderCalendar(currentYear, currentMonth);
loadFromSheetIfConfigured();
</script>
</body>
</html>
